    <script>
        class Promise {
           static PENDING = 'pending';
static FULFILLED = 'fulfilled';
static REJECTED = 'rejected';
            constructor(func) {
                this.result = null;
                this.resolveCallBacks = [];
                this.rejectCallBacks = [];
                this.status = Promise.PENDING;
                try {
                    func(this.resolve.bind(this), this.reject.bind(this));
                } catch (error) {
                    console.warn(error);
                }
            }
            resolve(result) {
                if (this.status === Promise.PENDING) {
                    this.status = Promise.FULFILLED;
                    this.result = result;
                    this.resolveCallBacks.forEach(func => {
                        queueMicrotask(() => {
                            try {
                                func(result);

                            } catch (error) {
                                console.warn(error);
                            }
                        })
                    });

                }
            }
            reject(result) {
                if (this.status === Promise.PENDING) {
                    this.status = Promise.REJECTED;
                    this.result = result;
                    this.rejectCallBacks.forEach(func => {
                        queueMicrotask(() => {
                            try {
                                func(result);

                            } catch (error) {
                                console.warn(error);
                            }
                        })
                    });

                }
            }
            then(onFulfilled , onRejected){
                // 1、先判断是否为函数
                onFulfilled = typeof onFulfilled ==="function" ? onFulfilled : value => { return value};
                onRejected = typeof onRejected ==="function" ? onRejected : error => { throw error};
                // 2、返回一个promise
                return new Promise((resolve , reject) => {
                    // 3、写处理回调函数的函数
                    const handelCallbacks = (backs , result) => {
                      try{
                          const res = backs(result);
                        return res instanceof Promise ? res.then(resolve , reject) : resolve(res);
                      }catch(error){
                        console.warn(error);
                      }
                    }
                    const self = this;
                    // 4、进行状态的对应处理
                    switch (self.status) {
                        case Promise.PENDING:
                            self.resolveCallBacks.push((value => handelCallbacks(onFulfilled , value)));
                            self.rejectCallBacks.push((value => handelCallbacks(onRejected , value)));
                            
                            break;
                    
                        case Promise.FULFILLED:
                           queueMicrotask(() => {
                             handelCallbacks(onFulfilled , self.result);
                           })
                            break;
                        case Promise.REJECTED:
                            queueMicrotask(() => {
                                handelCallbacks(onRejected , self.result);
                            })
                            break;
                    }


                })

                 }

               })

            }
        
        }
    </script>
