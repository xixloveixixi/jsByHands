<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写二分以及柯里化</title>
</head>

<body>
    <script>
        // 1、手写二分
        function search(arr, target) {
            if (arr.length === 0) {
                return -1;
            }
            let left = 0;
            let right = arr.length - 1;
            while (left <= right) {
                let mid = Math.floor((left + right) / 2);
                if (arr[mid] === target) {
                    return mid;
                } else if (arr[mid] < target) {
                    left = mid + 1;
                } else {
                    right = mid - 1;
                }
            }
            return -1;
        }
        const sortedArr = [1, 2, 3, 4, 5, 6, 8]; // 先排序
        const index = search(sortedArr, 4);
        console.log(index); // 这样才能正确输出 3
        // 2、手写柯里化
        // 当目前的args参数个数为0的时候就要返回执行的函数
        // 如果参数个数不为0就要push
        function curry(fn) {
            let allArgs = [];
            return function curried(...args) {
                // 如果说allArgs的值大于fn的参数值，就要执行这个函数
                if (args.length === 0) {
                    // 执行
                    return fn.apply(this, allArgs);
                } else {
                    allArgs.push(...args);
                    return curried;
                }
            }
        }
        function add(...args) {
            return args.reduce((total, cur) => total += cur, 0);
        }

        const sum = curry(add);

        console.log(sum(1)(2)(3)()); // 输出 6
        console.log(sum(1, 2)(3, 4)()); // 输出 10
    </script>

</body>

</html>
