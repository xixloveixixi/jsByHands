<body>
    <script>
        
        function check(obj){
            if(Array.isArray(obj)){
                if(obj.length === 0){
                    return '数组为空'
                }
            }else {
                let hasValidPair = Object.values(obj).some(value => value != null)
                return hasValidPair;
            }

        }
        let arr = [];
        console.log(check(arr))
        let obj = {
            name:'jyx',
            age :null ,
        }
        console.log(check(obj))
    </script>
