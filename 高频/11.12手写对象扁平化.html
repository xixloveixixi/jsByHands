<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写对象扁平化</title>
</head>
<body>
    <script>
        let arr = [1,2,[3,4,5,[6,7]]]
        function flat (arr){
            let flatArr = [];
            for(let i = 0 ; i < arr.length ; i++){
                if(Array.isArray(arr[i])){
                    flatArr = flatArr.concat(flat(arr[i]));
                }else {
                    flatArr.push(arr[i])
                }
            }
            return flatArr;

        }
        console.log(flat(arr));
    </script>
    
</body>
</html>
