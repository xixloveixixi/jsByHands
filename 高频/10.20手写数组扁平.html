<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写数组扁平</title>
</head>
<body>
    <script>
        let arr = [1,2,[3,4,[5,6]]];
        function flat(arr){
            let newArr = [];
            for(let i = 0 ; i < arr.length ; i++){
                if(Array.isArray(arr[i])){
                    newArr = newArr.concat(flat(arr[i]))
                }else {
                    newArr.push(arr[i]);
                }
            }
            return newArr;

        }
        console.log(flat(arr));
    </script>
    
</body>
</html>
