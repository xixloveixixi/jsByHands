<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千分位数</title>
</head>
<body>
    <script>
// 请实现一个函数 formatNumber(num)，它接收一个数字，并返回一个字符串，该字符串将数字以千分位的形式格式化。

// 要求：

// 处理整数部分，从右往左每三位用逗号 , 分隔。
// 保留小数部分（如果有的话），小数部分不需要添加逗号。
// 能正确处理正数、负数和 0。
function formatNumber(num) {
    // 1. 处理0的特殊情况
    if (num === 0) return '0';

    let fh = ''; // 符号
    let bigNum = ''; // 整数部分
    let smallNum = ''; // 小数部分

    // 2. 判断是否是负数，并提取符号
    if (num < 0) {
        fh = '-';
        num = Math.abs(num); // 使用绝对值继续处理
    }

    // 3. 将数字转为字符串，并分离整数和小数部分
    const numStr = num.toString();
    if (numStr.includes('.')) { // 注意是 includes 不是 include
        const parts = numStr.split('.');
        bigNum = parts[0];
        smallNum = parts[1];
    } else {
        bigNum = numStr;
    }

    // 4. 核心步骤：处理整数部分
    // 你的反转思路很好，我们用一个更直接的方式来实现
    let resultBigNum = '';
    let count = 0;
    let reserveBigNum = bigNum.split('').reverse();
    for(let i = 3 ; i < bigNum.length ; i += 4){
        reserveBigNum.splice(i , 0 , ',');
    }
    resultBigNum = reserveBigNum.reverse().join('');

    // 5. 拼接所有部分
    let finalResult = fh + resultBigNum;
    if (smallNum) {
        finalResult = finalResult + '.' + smallNum;
    }

    return finalResult;
}
console.log(formatNumber(1234567))      // "1,234,567"
console.log(formatNumber(1234567.89))   // "1,234,567.89"
console.log(formatNumber(-9876543.21))  // "-9,876,543.21"
console.log(formatNumber(0))             // "0"


    </script>
</body>
</html>
