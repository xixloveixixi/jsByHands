        function debounce(fn , wait){
          let timer = null;
          return function(){
                           const context = this;
                const args = arguments;
            if(timer){
                clearTimeout(timer);
            }else {
                setTimeout(() => {
                    fn.aplly(context , args);
                } , wait)
            }
          }

        }
