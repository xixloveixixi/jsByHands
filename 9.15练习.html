        // 2、数组的map
        let arr = [1,2,3,4,5];
        Array.prototype.myMap = function(fn){
            let newArr= [];
            this.forEach((ele) => {
                newArr.push(fn(ele));
            })
            return newArr;
        }
        let mapArr = arr.myMap((ele) => ele * 2);
        console.log(mapArr);

        // 4、js转换为树结构
               source = [{
            id: 1,
            pid: 0,
            name: 'body'
        }, {
            id: 2,
            pid: 1,
            name: 'title'
        }, {
            id: 3,
            pid: 2,
            name: 'div'
        }]
        function changeTree(nodes){
            function mapTree(nodes , pid){
                return nodes.filter((ele) => 
                    ele.pid === pid
                ).map((ele) => ({
                        ...ele,
                        children:mapTree(nodes , ele.id)
                })
                )
            }
           return  mapTree(nodes , 0 );
        }
        console.log(changeTree(source));
        // 5、灯亮
        function red(){
            console.log('红色');
        }
          function yellow(){
            console.log('黄色');
        }
          function green(){
            console.log('绿色');
        }
        let task = (light , timer) => {
            return new Promise((resolve,reject) => {
              setTimeout(() => {
                try{
                    if(light === 'red') red();
                    else if(light === 'yellow') yellow();
                    else if(light === 'green') green();
                    else reject(new TypeError('发生了错误'));
                    resolve();
                }catch(error){
                    reject(error);
                }
              } , timer)
            })
        }
        let step = (fn , timer) => {
           task('red' , 3000)
           .then(() => task('yellow' , 2000))
           .then(() => task('green' , 1000))
           .then(step)
        }
        // step();
        // 6、移除小孩
        function childrenNum(num , count){
            let childrenArr = [];
            let index= 0 ;
            for(let i = 0 ; i < num ; i++){
                childrenArr.push( i + 1);
            }
            while(childrenArr.length > 1){
                index = (index + 2) % childrenArr.length;
                childrenArr.splice(index , 1); 
            }
            return childrenArr[0];
        }
        console.log(childrenNum(30 , 3));

        function Imgaync(url){
    return new Promise((resolve, reject) => {
        // 创建一个容器
        let img = new Image();
        img.src = url;
        img.onload = function(){
            console.log('图片正在加载中......');
            resolve(img); // 修复：使用img变量
        }
        img.onerror = function(){
            console.log('图片加载失败！')
            reject(new Error('图片加载失败')); // 修复：创建新的错误对象
        }
    })
