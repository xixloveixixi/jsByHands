<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObjectCreate</title>
</head>
<body>
    <script>
      function myObjectCreate(newObj , oldObj){
        console.log(typeof newObj);
        if(typeof newObj !== 'object' || newObj === null){
            throw new Error('第一个参数必须是一个对象');
        }

        Object.setPrototypeOf(newObj , oldObj);
        return newObj;

      }

        const person = {
            name: 'John',
            age: 30
        };
        const newObjbj = {};
        const student = myObjectCreate(newObjbj, person);
        student.grade = 'A';
        console.log(null); // { grade: 'A' }


    </script>
    
</body>
</html>
