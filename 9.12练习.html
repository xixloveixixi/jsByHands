        // createObject
        function createObject(val){
            if(typeof val !=="object" || val === null){
                return val;
            }
            function F(){};
            F.prototype = val;
            return new F();
        }
        let obj = Object.create({
            age : 10 ,
            name : 'jyx'
        })
        console.log(obj);
        console.log(createObject({

        function changeTree(val){
            function mapTree(nodes , pid){
                return nodes.filter((ele) => ele.pid === pid )
                .map((ele) => ({
                    ...ele,
                    children : mapTree(nodes , ele.id)
                }))
            }
              return mapTree(val , 0);
        }
        const newTree = changeTree(source);
        console.log(newTree);

        function myNew(constructor , ...args){
            if(typeof obj !=="object" || obj === null){
                throw TypeError('类型错误')
            }
            let newObj = Object.create(constructor.prototype);
            let res = constructor.apply(obj , args);
            return typeof res ==="object" ? res : newObj;
        }
        console.log(myNew(Object , {

        // 解析url
          let url = 'http://www.domain.com/?user=anonymous&id=123&id=456&city=%E5%8C%97%E4%BA%AC&enabled';
       console.log( parseParam(url));
       function parseParam(url){
        let param = url.split('?')[1];
        let pairParam = param.split('&');
        console.log(pairParam);
        let pairMap = new Map();
        pairParam.forEach(element => {
             if (/=/.test(element)) {
            let [key , val] = element.split('=');
            let decodeKey = decodeURIComponent(key);
            let decodeVal = decodeURIComponent(val);
            if(pairMap.has(decodeKey)){
                  // 判断是否有数组
                let exParam = pairMap.get(decodeKey);
              if(Array.isArray(exParam)){
                    exParam.push(element[decodeKey]);
                }else {
                    pairMap.set(decodeKey , [decodeVal , exParam]);
                }
            }else {
                pairMap.set(decodeKey , decodeVal);
            }
        }else { 
            let key = element.split('=');
            let decodeKey = decodeURIComponent(key);
            pairMap.set(decodeKey  , true);
        }
        });
        let ans = {};
       for(let [key , val] of pairMap){
        ans[key] = val;
       }
       return ans;
       }

// 下面来看一道比较典型的问题，通过这个问题来对比几种异步编程方法：
// 红灯 3s 亮一次，绿灯 1s 亮一次，黄灯 2s 亮一次；如何让三个灯不断交替重复亮灯？
function printColor(){
    while(1){
        setTimeout(() => {
            green();
        },1000);
         setTimeout(() => {
            yellow();
        },2000);
         setTimeout(() => {
            red();
        },3000);
    }
}

// promise:
function red() {
    console.log('red');
}
function green() {
    console.log('green');
}
function yellow() {
    console.log('yellow');
}

const task = (timer, light) => {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            try {
                if (light === 'red') red();
                else if (light === 'yellow') yellow();
                else if (light === 'green') green();
                else reject(new Error('Invalid light color'));
                resolve();
            } catch (error) {
                reject(error);
            }
        }, timer);
    });
};
