<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9.27练习</title>
</head>
<body>
    <script>
        // 1、手写柯里化
        function currying(fn){
            let allArgs = [];
            return function curried(...args){
                if(!arguments.length){
                    // 如果没有传递参数了，就执行
                    return fn.apply(this , allArgs);
                }else {
                    // 如果还有传入值的话
                    allArgs = [...allArgs , ...args];
                    return curried;
                }
            }

        }
        function sum(...args){
            return args.reduce((prev , total) => prev + total);
        }
        let add = currying(sum);
        let result = add(1)(2)(3)();
        console.log(result);
    </script>
    
</body>
</html>
