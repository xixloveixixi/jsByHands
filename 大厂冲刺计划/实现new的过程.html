        // // 总结new：
        // // 构造函数类型拦截->创建一个新对象(包含了构造函数的原型)->执行构造函数->返回值
        function myNew(constructor , ...args){
            // 1、拦截
            if(typeof constructor !=="function"){
                throw TypeError('构造函数的类型应为函数类型！！！');
            }
            // 2、创建对象并把原型传给他
            let newObj = Object.create(constructor.prototype);
            // 3、执行构造函数
            let res = constructor.apply(newObj , args);
            // 4、返回
            return (res !== null && typeof res ==="object" ) ? res : newObj;

        }
