    <script>
        // 1、防抖函数
        function debounce(fn, wait) {
            let timer = null;
            const context = this;
            const args = arguments;
            return function () {
                if (timer) {
                    clearTimeout(timer);
                } else {
                    timer = setTimeout(() => {
                        fn.apply(context, args);
                    }, wait)

                }
            }
        }
        // 2、节流函数
        function throttle(fn, deley) {
            let lastTime = 0;
            return function () {
                const nowTime = Date.now();
                const context = this;
                const args = arguments;
                if(nowTime - lastTime >= deley){
                    fn.apply(context , args);
                    lastTime = nowTime;
                }

            }

        }
        // 3、手写浅拷贝
        const obj = {
            name : 'jyx',
            age : 18 ,
            hobby:{
                outdoor:{
                    swim:'swim'
                }
            }
        }
        function copy(obj){
            if(typeof obj !=="object" || obj === null){
                return obj;
            }
            const newObj = Array.isArray(obj) ? [] : {};
            for(let key in obj){
                if(obj.hasOwnProperty(key)){
                    newObj[key] = obj[key];
                }
            }
            return newObj;
        }
        // const newObj = copy(obj);
        // console.log('newObj',newObj);
        // newObj.hobby.outdoor.swim = 'swimm';
        // console.log('obj', obj);
        // 4、手写深拷贝
        function deepCopy(obj){
             if(typeof obj !=="object" || obj === null){
                return obj;
            }
            const newObj = Array.isArray(obj) ? [] : {};
            for(let key in obj){
                if(obj.hasOwnProperty(key)){
                    newObj[key] =typeof obj[key] ==="object" ? deepCopy(obj[key]) : obj[key];
                }
            }
            return newObj;

        }
        const newObj = deepCopy(obj);
        console.log('newObj',newObj);
        newObj.hobby.outdoor.swim = 'swimm';
        console.log('obj', obj);

        // 5、数组去重
        let arr = [1,3,2,1,4,5,4,5,3,4];
        console.log(Array.from(new Set(arr)));
        // 6、数组的flat
        let flatArr = [1,2,3,[4,[5,6]]];
        function myFlat(arr){
            let newArr = [];
            for(let i = 0 ; i < arr.length ; i++){
                if(Array.isArray(arr[i])){
                    newArr = newArr.concat(myFlat(arr[i]));
                }else {
                    newArr.push(arr[i]);
                }
            }
            return newArr;
        }
        const newFlatArr = myFlat(flatArr);
        console.log(newFlatArr);
        // 7、数组的filter
        Array.prototype.myFilter = function(fn){
            const newArr = [];
            const arr = this;
            for(let i = 0 ; i < arr.length ; i++){
                if(fn(arr[i])){
                    newArr.push(arr[i]);
                }
            }
            return newArr;

        }
        console.log( arr.myFilter((val) => val % 2 === 0));

        Array.prototype.myMap = function(fn){
            if(typeof fn !=="function"){
                throw new TypeError('传入的类型错误!!!')
            }
            const res = [];
            const arr = this;
            for(let i = 0 ; i < arr.length ; i++){
                res.push(fn(arr[i]));
            }
            return res;
        }
