    <script>
        // 1、防抖函数
        function debounce(fn, time) {
            let timer = null;
            return function (...params) {
                let args = params;
                let context = this;
                if (timer) {
                    clearTimeout(timer);
                }
                timer = setTimeout(() => {
                    fn.apply(context, args);
                }, time);
            }
        }
        // 2、节流函数:规定一个单位时间，在这个单位时间内，只能有一次触发事件的回调函数执行
        function throttle(fn, delay) {
            let lastTime = 0;
            return function (...params) {
                let args = params;
                let context = this;
                let nowTime = new Date();
                if (nowTime - lastTime <= delay) {
                    fn.apply(context, params);
                    lastTime = nowTime;
                }
            }
        }

        Function.prototype.myCall = function (context, ...args) {
            // fn.call(thisArg: any, ...argArray: any[])
            if (typeof this !== "function") {
                throw new TypeError('类型错误');
            }
            // 把这个函数记录下来
            let key = Symbol('temp');
            context[key] = this;
            let res = context[key](args);
            return res;
        }
