<body>
    <script>
        // 交换a,b的值，不能用临时变量
        function swap(a , b){
            a = a + b ; 
             b = a - b ;
             a = a - b;
             return [a , b]
        }
        console.log(swap(3,5));
    </script>
    
</body>
