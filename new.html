<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>new的js手写代码</title>
</head>

<body>
  <script>
//  new的手写
   function myNew(constructor , ...args){
    // 1.判断类型
    if(typeof constructor !== 'function'){
      throw new Error('传入的必须为函数')
    }
    // 2.新建一个对象
    let newObj = Object.create(constructor.prototype);
    // 3.改变this指向以及执行函数获得结果
    const res = constructor.apply(newObj , ...args);
    // 4.返回
    return (typeof res === 'object' && typeof res !== null) ? res : newObj;
   }
  </script>


</body>

</html>
