        // typeof可以判断简单的数据类型：number/string/boolean
        // 但是对于一些复杂的数据类型：function/array都是返回的object
        // 我们要使用Object.prototype.toString.call：找到复杂数据的类型
        console.log(Object.prototype.toString.call([1,2,3]).slice(8 , -1)) //object [object Array] Array
        // 手写类型识别函数
        function getType(value){
            // 1、对特殊值null进行判断
            if(value === null){
                return value;
            }
            // 2、对普通数据结构进行判断
            if(typeof value !== 'object'){
                return typeof value;
            }else {
                return Object.prototype.toString.call(value).slice(8, -1).toLowerCase();
            }
        }
        console.log('测试')
       console.log(getType(null));      // "null"

console.log(getType(() => {}));  // "function"
console.log(getType(Symbol()));  // "symbol"
console.log(getType([1, 2, 3])); // "array"
console.log(getType({}));        // "object"
