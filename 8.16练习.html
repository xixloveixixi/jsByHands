<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8.16练习</title>
</head>
<body>
    <script>
        let arr = [1,1,2,2,3,4,5]
        // 1、数组乱序化
        function randomArr(arr){
            let len = arr.length ;
            while(len){
                let random = Math.floor(Math.random() * len--);
                let temp = arr[len];
                arr[len] = arr[random];
                arr[random] = temp;
            }
            return arr;

        }
        console.log(randomArr(arr));
        // 2、数组求和
        function sum (arr) {
            return arr.reduce((total,pre) => total += pre , 0)
        }
        console.log(sum(arr));
        // 3、数组去重
        console.log(Array.from(new Set(arr)));
        // 4、数组的flat
        let flatArr = [1,2,3,[4,5,[6]]];
        function flat(arr){
            let newArr = [];
            for(let i = 0 ; i < arr.length ; i++){
                if(Array.isArray(arr[i])){
                    // 如果是数组
                    newArr = flat(newArr.concat(arr[i]));
                }else {
                    newArr.push(arr[i]);
                }
            }
            return newArr;
        }
        console.log(flat(flatArr));
        // 5、数组的push
        Array.prototype.myPush = function(){
            for(let i = 0 ; i < arguments.length ; i++){
                this[this.length] = arguments[i];
            }
            return this.length;
        }
        arr.myPush(8);
        console.log(arr);
    </script>
    
</body>
</html>
