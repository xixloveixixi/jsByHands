<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instance of 复习</title>
</head>
<body>
    <script>
       function myInstancecOf(newObj , obj){
        if(typeof newObj !== 'object' || typeof newObj === null){
            return ;
        }
        let curPrototype = newObj.__proto__;
        while(curPrototype !== null){
            if(curPrototype === obj.prototype){
                return true;
            }
            curPrototype = curPrototype.__proto__;
        }
        return false;
       }
    </script>
    
</body>
</html>
