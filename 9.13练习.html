        // 2、数组的filter
        let arr = [1, 2, 3, 4, 5];
        Array.prototype.myFilter = function (fn) {
            let filterArr = [];
            arr.forEach((ele) => {
                if (fn(ele)) {
                    filterArr.push(ele);
                }
            })
            return filterArr;
        }
        console.log(arr.myFilter((ele) => ele % 2 === 0))

        // 4、es5和es6求函数参数的和
        // es5
        function sumES5() {
            let sum = 0;
            for (let i = 0; i < arguments.length; i++) {
                sum + arguments[i];
            }
            return sum;
        }
        function sumES6(...rest) {
            return rest.reduce((total, prev) => total + prev, 0);
        }
        console.log(sumES5(1, 2, 3, 4)); // 应该输出: 10
        console.log(sumES5(10, 20));     // 应该输出: 30
        console.log(sumES5(-1, -2, -3)); // 应该输出: -6
        console.log(sumES5());           // 应该输出: 0
        console.log(sumES6(1, 2, 3, 4));       // 应该输出: 10
        console.log(sumES6(10, 20));           // 应该输出: 30
        console.log(sumES6(-1, -2, -3));       // 应该输出: -6
        console.log(sumES6());                 // 应该输出: 0
        // 5、instanceOf
        function myInstanceOf(val, comVal) {
            if (typeof val !== "object" || val === null) {
                throw TypeError('类型错误');
            }
            let curPrototype = val.__proto__;
            while (curPrototype !== null) {
                if (comVal.prototype = curPrototype) {
                    return true;
                }
                curPrototype = curPrototype.__proto__;
            }
            return false;
        }
        let obj = {
            name: 'jyx',
            age: 19
        }
        console.log(myInstanceOf(obj, Object));
        // 6、灯亮
        function red() {
            console.log('红色');
        }
        function yellow() {
            console.log('黄色');
        }
        function green() {
            console.log('绿色');
        }
        // 使用promise方法
        const task = (light, timer) => {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (light === 'red') {
                        red();
                    } else if (light === 'yellow') {
                        yellow();
                    } else if (light === 'green') {
                        green();
                    }
                    resolve()
                } ,timer)
            })
        }
        let step = () => {
            task('red', 3000)
                .then(() => task('yellow', 2000))
                .then(() => task('green', 1000))
                .then(step)
        }
